name: "Build Reflash"
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
env:
  TERM: xterm-256color

jobs:
  test:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js '18'
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install client deps
      working-directory: ./client
      run: npm ci

    - name: Run tests
      run: make test

  package:
    runs-on: self-hosted
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Use tag as version
      run: echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    - uses: actions/checkout@v3
    - name: Use Node.js '18'
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # Only the dependency install stays here: `make docker` now depends on
    # build-go and build-vue, so building them separately in CI would just be a
    # second place that has to be kept in step with the Makefile.
    - name: Install client deps
      working-directory: ./client
      run: npm ci

    - name: Make image
      run: |
        make docker
        mv output/*.img.xz .

    - name: Release if tagged
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true
        artifacts: "reflash-*.img.xz"
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true
