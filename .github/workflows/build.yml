name: "Build Reflash"
on:
  # Branch pushes still get tests, because that feedback is worth keeping - but
  # they run on GitHub's disposable runners, never on Coronas. See the note on
  # the test job.
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  # Build an image without cutting a tag. This is the only way to put work on
  # the self-hosted runner deliberately, rather than as a side effect of a push.
  workflow_dispatch:
    inputs:
      job:
        description: 'What to run'
        type: choice
        default: test
        options:
          - test
          - package
env:
  TERM: xterm-256color

jobs:
  test:
    # ubuntu-latest, NOT self-hosted. This job runs whatever code was pushed to
    # whatever branch, and `npm ci` alone executes arbitrary install scripts from
    # the lockfile. This repo is public, so that must not happen on a machine we
    # own - the runner is non-ephemeral, holds its own credentials, and builds
    # images with --privileged and /dev mounted, so a compromise there persists.
    #
    # GitHub-hosted standard runners are free with unlimited minutes for public
    # repositories, so this costs nothing and removes the whole exposure.
    #
    # Go is preinstalled on the image; bats is not. There are no bats-support or
    # bats-assert helpers - test/bats loads a local helper.bash - so the distro
    # package is enough.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js '18'
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install bats
      run: sudo apt-get update && sudo apt-get install -y bats

    - name: Install client deps
      working-directory: ./client
      run: npm ci

    - name: Run tests
      run: make test

  package:
    # The only job that needs Coronas: it builds the image in Docker against the
    # local build tree. Never runs on a push to a branch - tags, or an explicit
    # dispatch, and nothing else.
    #
    # needs: test means a dispatched package build runs the suite first, on the
    # free runner, before anything touches the self-hosted machine.
    runs-on: self-hosted
    needs: test
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' &&
       github.event.inputs.job == 'package')
    steps:
    - name: Use tag as version
      run: echo "VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

    - uses: actions/checkout@v3
    - name: Use Node.js '18'
      uses: actions/setup-node@v3
      with:
        node-version: 18

    # Only the dependency install stays here: `make docker` now depends on
    # build-go and build-vue, so building them separately in CI would just be a
    # second place that has to be kept in step with the Makefile.
    - name: Install client deps
      working-directory: ./client
      run: npm ci

    - name: Make image
      run: |
        make docker
        mv output/*.img.xz .

    - name: Release if tagged
      uses: ncipollo/release-action@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        allowUpdates: true
        artifacts: "reflash-*.img.xz"
        token: ${{ secrets.GITHUB_TOKEN }}
        prerelease: true
