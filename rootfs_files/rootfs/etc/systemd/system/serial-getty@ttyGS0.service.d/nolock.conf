[Service]
# Keep this getty away from /dev/console, or it takes down every other getty on
# the board - including the serial console this appliance is debugged through.
#
# A stock getty unit sets StandardInput=tty and TTYPath=/dev/%I, so systemd opens
# the terminal itself, in the executor, before exec'ing agetty. Any unit that may
# touch a terminal first takes systemd's *global* /dev/console flock. Opening
# /dev/ttyGS0 blocks until carrier, and carrier here means a USB host has opened
# the other end of the ACM port - so with nothing plugged into the gadget port
# that open never returns and the lock is never dropped:
#
#   serial-getty@ttyGS0  pid=315 exe=systemd-executor wchan=wait_woken
#   serial-getty@ttyS0   pid=316 exe=systemd-executor wchan=locks_lock_inode_wait
#
# Both units still report active/running, because systemd considers a unit
# started once the executor is forked - it has not exec'd agetty yet. That is
# why this looks healthy in systemctl and dead on the wire: "Started Serial
# Getty on ttyS0" appears, no login prompt ever does, and the tty still echoes
# because the line discipline is alive with nothing reading it. Observed on 0484
# on 2026-09-11, which cost the board its only remaining way in once its WiFi
# was also unreachable.
#
# So: no terminal stdio and no TTYPath, which means systemd never takes the
# lock, and agetty opens the port itself - it uses O_NONBLOCK, so it does not
# block waiting for carrier. The device has to be named explicitly because the
# stock ExecStart passes `-`, meaning "the tty is already open on stdin", which
# is exactly what is no longer true. TERM comes from the environment for the
# same reason: systemd derives it from TTYPath, and there no longer is one.
#
# Lifted from Rebuild, which carries this for its own images
# (userpatches/overlay/install_components/usb_gadget_getty.sh). Reflash had the
# udev rule that starts this getty but never the drop-in that makes it safe.
Environment=TERM=vt220
StandardInput=null
StandardOutput=null
StandardError=journal
TTYPath=
TTYReset=no
TTYVHangup=no
TTYVTDisallocate=no
ExecStart=
ExecStart=-/sbin/agetty -o '-- \\u' --noreset --noclear --keep-baud 115200,57600,38400,9600 %I ${TERM}
