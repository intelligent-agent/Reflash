[Unit]
# Tie this getty's lifetime to the gadget's.
#
# 99-recore-otg.rules starts it with SYSTEMD_WANTS, which binds it to
# dev-ttyGS0.device and to nothing else - so nothing ordered it against
# usb-gadget-setup, and shutdown could begin tearing the gadget down while this
# getty still held the port. On a 10-cycle reboot loop that hung the board on
# cycle 10:
#
#   15228.73  Stopping usb-gadget-setup.service...
#   15228.81  Stopped serial-getty@ttyGS0.service
#   <nothing - "reboot: Restarting system" never printed>
#
# The `echo "" > UDC` in the teardown unbinds the gadget through
# gserial_disconnect() while the tty layer is closing the same port. The writer
# ends up in uninterruptible sleep, so there is no panic to find, TimeoutStopSec
# cannot kill it, and the board sits powered with its console already torn down
# - looking alive, because simpledrm keeps scanning out the last frame.
#
# After= stops this getty first, shutdown being reverse order. BindsTo= also
# takes it down whenever the gadget goes away for any other reason, such as a
# usb_role change. Rebuild carries the same pair for its images for the same
# reason (userpatches/overlay/install_components/usb_gadget_getty.sh, #86).
BindsTo=usb-gadget-setup.service
After=usb-gadget-setup.service
