# journald's default is Storage=auto, which writes persistently if
# /var/log/journal exists and volatile (/run) otherwise. This root fs is a
# RAM-backed initramfs capped at half of RAM, while /run is a separate and much
# roomier tmpfs - so the journal belongs there. It already ends up in /run today
# only because that directory happens to be empty; make it explicit so a future
# package cannot silently flip the journal onto the space-constrained rootfs.
[Journal]
Storage=volatile
RuntimeMaxUse=16M
